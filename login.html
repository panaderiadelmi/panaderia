<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Delmi Soriano</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

        :root{
            --gold:#F59E0B; --gold-d:#D97706; --gold-l:#FCD34D;
            --bg:#000; --bg2:#0a0a0a; --bg3:#111; --bg4:#1a1a1a;
            --border:rgba(245,158,11,0.15); --border-h:rgba(245,158,11,0.4);
            --t1:#FFF; --t2:#E2E8F0; --t3:#94A3B8; --t4:#475569;
        }

        body{
            font-family:'Inter',sans-serif;
            background:var(--bg);
            color:var(--t2);
            min-height:100vh;
            display:grid;
            grid-template-columns:1fr 1fr;
        }

        /* ── LEFT PANEL ── */
        .panel-left{
            position:relative;
            background:linear-gradient(135deg, #0a0500 0%, #1a0f00 40%, #0d0800 100%);
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            padding:60px 48px;
            overflow:hidden;
        }

        .panel-left::before{
            content:'';
            position:absolute; inset:0;
            background:
                radial-gradient(ellipse 60% 50% at 30% 40%, rgba(245,158,11,0.12), transparent),
                radial-gradient(ellipse 40% 60% at 80% 70%, rgba(180,83,9,0.08), transparent);
            pointer-events:none;
        }

        .brand{
            display:flex; flex-direction:column; align-items:center;
            gap:24px; text-align:center; position:relative; z-index:1;
        }

        .brand-icon{
            font-size:5rem;
            filter:drop-shadow(0 0 40px rgba(245,158,11,0.4));
            animation:float 3s ease-in-out infinite;
        }

        @keyframes float{
            0%,100%{transform:translateY(0)}
            50%{transform:translateY(-8px)}
        }

        .brand-name{
            font-family:'Plus Jakarta Sans',sans-serif;
            font-size:2.2rem; font-weight:800;
            color:var(--t1);
            letter-spacing:-0.03em; line-height:1.1;
        }
        .brand-name span{color:var(--gold);}

        .brand-tagline{
            font-size:1rem; color:var(--t3); line-height:1.7; max-width:320px;
        }

        .left-roles{
            margin-top:48px;
            display:flex; flex-direction:column; gap:10px;
            width:100%; max-width:340px;
        }

        .left-roles-title{
            font-size:0.7rem; font-weight:700; text-transform:uppercase;
            letter-spacing:0.1em; color:var(--t4); margin-bottom:4px;
        }

        .role-demo-item{
            display:flex; align-items:center; gap:12px;
            padding:10px 14px;
            background:rgba(255,255,255,0.03);
            border:1px solid rgba(255,255,255,0.06);
            border-radius:10px;
            cursor:pointer;
            transition:all 0.2s;
        }
        .role-demo-item:hover{
            background:rgba(245,158,11,0.06);
            border-color:rgba(245,158,11,0.2);
        }

        .role-badge{
            display:inline-flex; align-items:center; gap:5px;
            font-size:0.68rem; font-weight:700; text-transform:uppercase;
            letter-spacing:0.06em; padding:3px 10px; border-radius:999px;
            flex-shrink:0;
        }

        .role-creds{
            font-size:0.75rem; color:var(--t3);
            font-family:'Inter',monospace;
        }
        .role-creds strong{color:var(--t2);}

        /* ── RIGHT PANEL ── */
        .panel-right{
            background:var(--bg2);
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            padding:60px 48px;
            border-left:1px solid var(--border);
        }

        .login-box{
            width:100%; max-width:400px;
            display:flex; flex-direction:column; gap:28px;
        }

        .login-header{ display:flex; flex-direction:column; gap:8px; }

        .login-header h1{
            font-family:'Plus Jakarta Sans',sans-serif;
            font-size:1.8rem; font-weight:800;
            color:var(--t1); letter-spacing:-0.02em;
        }
        .login-header p{ font-size:0.9rem; color:var(--t3); }

        .login-form{ display:flex; flex-direction:column; gap:16px; }

        .form-group{ display:flex; flex-direction:column; gap:6px; }

        .form-label{
            font-size:0.72rem; font-weight:700; text-transform:uppercase;
            letter-spacing:0.08em; color:var(--t3);
        }

        .form-input{
            padding:12px 16px;
            background:var(--bg3);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:10px;
            color:var(--t1);
            font-family:'Inter',sans-serif;
            font-size:0.9rem;
            outline:none;
            transition:all 0.2s;
        }
        .form-input::placeholder{color:var(--t4);}
        .form-input:focus{
            border-color:var(--border-h);
            background:var(--bg4);
            box-shadow:0 0 0 3px rgba(245,158,11,0.1);
        }
        .form-input.error{
            border-color:rgba(239,68,68,0.5);
            box-shadow:0 0 0 3px rgba(239,68,68,0.1);
        }

        .input-wrapper{position:relative;}
        .input-icon{
            position:absolute; left:14px; top:50%; transform:translateY(-50%);
            color:var(--t4); pointer-events:none;
        }
        .form-input.has-icon{padding-left:42px;}

        .pwd-toggle{
            position:absolute; right:14px; top:50%; transform:translateY(-50%);
            background:none; border:none; color:var(--t4);
            cursor:pointer; padding:2px; transition:color 0.2s;
        }
        .pwd-toggle:hover{color:var(--t2);}

        .remember-row{
            display:flex; align-items:center; gap:10px;
        }

        .checkbox-custom{
            width:18px; height:18px;
            background:var(--bg3);
            border:1px solid rgba(255,255,255,0.12);
            border-radius:5px; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0; transition:all 0.2s;
        }
        .checkbox-custom.checked{
            background:rgba(245,158,11,0.2);
            border-color:var(--gold);
        }
        .checkbox-custom.checked::after{
            content:'✓'; font-size:0.7rem; color:var(--gold); font-weight:700;
        }

        .remember-label{font-size:0.82rem; color:var(--t3); cursor:pointer;}

        .btn-login{
            width:100%;
            padding:14px;
            background:linear-gradient(135deg, #92400e, var(--gold-d), var(--gold));
            border:none; border-radius:10px;
            color:#fff;
            font-family:'Plus Jakarta Sans',sans-serif;
            font-size:0.95rem; font-weight:700;
            cursor:pointer;
            transition:all 0.2s;
            display:flex; align-items:center; justify-content:center; gap:8px;
            position:relative; overflow:hidden;
        }
        .btn-login:hover{filter:brightness(1.1); transform:translateY(-1px); box-shadow:0 8px 24px rgba(245,158,11,0.35);}
        .btn-login:active{transform:translateY(0);}
        .btn-login:disabled{opacity:0.6; cursor:not-allowed; transform:none;}

        .btn-login .spinner{
            width:18px; height:18px;
            border:2px solid rgba(255,255,255,0.3);
            border-top-color:#fff;
            border-radius:50%;
            animation:spin 0.7s linear infinite;
            display:none;
        }
        .btn-login.loading .spinner{display:block;}
        .btn-login.loading .btn-text{display:none;}

        @keyframes spin{to{transform:rotate(360deg)}}

        .error-msg{
            display:flex; align-items:center; gap:8px;
            padding:12px 14px;
            background:rgba(239,68,68,0.08);
            border:1px solid rgba(239,68,68,0.25);
            border-radius:8px;
            font-size:0.82rem; color:#EF4444;
            display:none;
        }
        .error-msg.show{display:flex;}

        .divider{
            display:flex; align-items:center; gap:12px;
            color:var(--t4); font-size:0.75rem;
        }
        .divider::before,.divider::after{
            content:''; flex:1;
            height:1px; background:rgba(255,255,255,0.06);
        }

        .back-web{
            display:flex; align-items:center; justify-content:center; gap:6px;
            font-size:0.82rem; color:var(--t4);
            text-decoration:none; transition:color 0.2s;
        }
        .back-web:hover{color:var(--t2);}

        /* ── RESPONSIVE ── */
        @media (max-width:768px){
            body{grid-template-columns:1fr;}
            .panel-left{display:none;}
            .panel-right{padding:40px 24px;}
        }
    </style>
</head>
<body>

<!-- LEFT: BRAND + DEMO ROLES -->
<aside class="panel-left">
    <div class="brand">
        <div class="brand-icon">🥖</div>
        <h2 class="brand-name">Delmi<br><span>Soriano</span></h2>
        <p class="brand-tagline">Panel de administración. Accede con tus credenciales para gestionar productos, pedidos y usuarios.</p>

        <div class="left-roles" id="demo-roles">
            <div class="left-roles-title">Accesos de demostración</div>
            <!-- Se generan dinámicamente -->
        </div>
    </div>
</aside>

<!-- RIGHT: LOGIN FORM -->
<main class="panel-right">
    <div class="login-box">
        <div class="login-header">
            <h1>Bienvenida 👋</h1>
            <p>Inicia sesión para acceder al panel de gestión.</p>
        </div>

        <form class="login-form" id="login-form" novalidate>

            <!-- Email -->
            <div class="form-group">
                <label class="form-label" for="email">Correo electrónico</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    <input type="email" id="email" class="form-input has-icon"
                        placeholder="admin@delmisoriano.com" autocomplete="username">
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    <input type="password" id="password" class="form-input has-icon"
                        placeholder="••••••••" autocomplete="current-password" style="padding-right:44px">
                    <button type="button" class="pwd-toggle" id="pwd-toggle" aria-label="Mostrar contraseña">
                        <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <!-- Remember -->
            <div class="remember-row">
                <div class="checkbox-custom" id="remember-check" role="checkbox" aria-checked="false" tabindex="0"></div>
                <span class="remember-label" id="remember-label">Mantener sesión iniciada</span>
            </div>

            <!-- Error -->
            <div class="error-msg" id="error-msg" role="alert">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span id="error-text">Credenciales incorrectas.</span>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-login" id="btn-login">
                <span class="spinner"></span>
                <span class="btn-text">Iniciar sesión</span>
            </button>

            <div class="divider">o</div>

            <a href="index.html" class="back-web">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                Volver a la web principal
            </a>

        </form>
    </div>
</main>

<script src="auth.js"></script>
<script>
    /* Si ya hay sesión activa, redirigir al panel correspondiente */
    const existingSession = DS_AUTH.getSession();
    if (existingSession) {
        const perm = existingSession.rol;
        if (DS_AUTH.hasPermission('admin_productos')) {
            window.location.href = 'admin-productos.html';
        } else {
            window.location.href = 'index.html';
        }
    }

    /* ── DEMO CREDENTIALS en panel izquierdo ──────────────────── */
    const demoAccounts = [
        { rol:'administrador', email:'admin@delmisoriano.com',   pwd:'admin123'   },
        { rol:'almacen',       email:'almacen@delmisoriano.com', pwd:'almacen123' },
        { rol:'contabilidad',  email:'conta@delmisoriano.com',   pwd:'conta123'   },
        { rol:'cliente',       email:'cliente@delmisoriano.com', pwd:'cliente123' },
        { rol:'incognito',     email:'visita@delmisoriano.com',  pwd:'visita123'  },
    ];

    const demoContainer = document.getElementById('demo-roles');
    demoAccounts.forEach(a => {
        const role = DS_AUTH.ROLES[a.rol];
        const div = document.createElement('div');
        div.className = 'role-demo-item';
        div.title = 'Clic para autocompletar';
        div.innerHTML = `
            <span class="role-badge" style="background:${role.bg};border:1px solid ${role.border};color:${role.color};">
                ${role.emoji} ${role.label}
            </span>
            <span class="role-creds"><strong>${a.email}</strong> / ${a.pwd}</span>
        `;
        div.addEventListener('click', () => {
            document.getElementById('email').value    = a.email;
            document.getElementById('password').value = a.pwd;
            document.getElementById('email').focus();
        });
        demoContainer.appendChild(div);
    });

    /* ── TOGGLE PASSWORD ──────────────────────────────────────── */
    let pwdVisible = false;
    document.getElementById('pwd-toggle').addEventListener('click', () => {
        pwdVisible = !pwdVisible;
        const input = document.getElementById('password');
        input.type = pwdVisible ? 'text' : 'password';
        document.getElementById('eye-icon').style.opacity = pwdVisible ? '0.5' : '1';
    });

    /* ── REMEMBER CHECKBOX ────────────────────────────────────── */
    let rememberMe = false;
    const remCheck = document.getElementById('remember-check');
    function toggleRemember() {
        rememberMe = !rememberMe;
        remCheck.classList.toggle('checked', rememberMe);
        remCheck.setAttribute('aria-checked', String(rememberMe));
    }
    remCheck.addEventListener('click', toggleRemember);
    document.getElementById('remember-label').addEventListener('click', toggleRemember);
    remCheck.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') toggleRemember(); });

    /* ── LOGIN FORM ───────────────────────────────────────────── */
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn      = document.getElementById('btn-login');
        const errDiv   = document.getElementById('error-msg');
        const errText  = document.getElementById('error-text');

        // Clear errors
        errDiv.classList.remove('show');
        document.getElementById('email').classList.remove('error');
        document.getElementById('password').classList.remove('error');

        // Validate
        if (!email || !password) {
            errText.textContent = 'Por favor, introduce tu email y contraseña.';
            errDiv.classList.add('show');
            return;
        }

        // Loading state
        btn.disabled = true;
        btn.classList.add('loading');

        // Simulate network delay for UX
        await new Promise(r => setTimeout(r, 700));

        try {
            const session = DS_AUTH.login(email, password);

            // Success! Visual feedback
            btn.classList.remove('loading');
            btn.innerHTML = '<span style="font-size:1.1rem">✅</span> <span class="btn-text">Accediendo...</span>';

            await new Promise(r => setTimeout(r, 600));

            // Redirect based on role
            if (DS_AUTH.hasPermission('admin_productos')) {
                window.location.href = 'admin-productos.html';
            } else {
                window.location.href = 'index.html';
            }

        } catch (err) {
            btn.disabled = false;
            btn.classList.remove('loading');
            document.getElementById('email').classList.add('error');
            document.getElementById('password').classList.add('error');
            errText.textContent = err.message;
            errDiv.classList.add('show');
        }
    });
</script>
</body>
</html>
